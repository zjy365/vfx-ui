<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const root = document.documentElement;
        try {
          const savedTheme = localStorage.getItem("vfx-ui-theme");
          const mode = savedTheme === "light" || savedTheme === "system" ? savedTheme : "dark";
          if (mode === "system") root.removeAttribute("data-theme");
          else root.dataset.theme = mode;
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          root.dataset.scheme = mode === "system" ? (prefersDark ? "dark" : "light") : mode;
        } catch {
          root.dataset.theme = "dark";
          root.dataset.scheme = "dark";
        }
      })();
    </script>
    <meta
      name="description"
      content="VFX UI — shader-native visual effect components for React, rendered on the GPU via WebGPU. Wave backgrounds, liquid glass, globes, and live charts. Copy, paste, and ship."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VFX UI" />
    <meta property="og:title" content="Shader Effect Components for React | VFX UI" />
    <meta property="og:description" content="Shader-native visual effect components for React, rendered on the GPU via WebGPU. Copy, paste, and ship." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shader Effect Components for React | VFX UI" />
    <meta name="twitter:description" content="Shader-native visual effect components for React, rendered on the GPU via WebGPU." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Shader Effect Components for React | VFX UI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
