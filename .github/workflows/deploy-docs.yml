name: Check public product build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VGPU_ADAPTER: software
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level=low
      - name: Build packages and static product site
        run: pnpm build
      - name: Typecheck all packages and applications
        run: pnpm typecheck
      - name: Verify catalog, free registry and MCP boundary
        run: pnpm catalog:check
      - name: Verify packaged React 18 and React 19 consumers
        run: pnpm test:consumer
      - name: Verify isolated registry consumers
        run: node scripts/check-registry-consumers.mjs
      - name: Install and verify CPU WebGPU renderer
        run: |
          export VGPU_CACHE_DIR="$RUNNER_TEMP/vgpu-cache"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/vgpu-runtime"
          printf 'VGPU_CACHE_DIR=%s\nXDG_RUNTIME_DIR=%s\n' "$VGPU_CACHE_DIR" "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 libdrm2 libudev1 libzstd1 zlib1g
          install -d -m 700 "$XDG_RUNTIME_DIR"
          # The locked vgpu CLI verifies its portable lavapipe release by SHA-256.
          pnpm --filter @vfx-ui/core exec vgpu install-software-renderer
          pnpm --filter @vfx-ui/core exec vgpu doctor --pretty
      - name: Unit, regression and MCP smoke tests
        timeout-minutes: 10
        run: pnpm test
      # Cloudflare Pages publishes main through its existing Git integration.
      # Build output remains apps/docs/dist; this workflow does not deploy.
