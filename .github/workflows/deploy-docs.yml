name: Check public product build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages and static product site
        run: pnpm build
      - name: Typecheck all packages and applications
        run: pnpm typecheck
      - name: Verify catalog, free registry and MCP boundary
        run: pnpm catalog:check
      - name: Verify packaged React 18 and React 19 consumers
        run: pnpm test:consumer
      - name: Verify isolated registry consumers
        run: node scripts/check-registry-consumers.mjs
      - name: Unit, regression and MCP smoke tests
        run: pnpm test
      # Cloudflare Pages publishes main through its existing Git integration.
      # Build output remains apps/docs/dist; this workflow does not deploy.
