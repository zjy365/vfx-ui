name: Verify public npm release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify registry metadata and install outside the workspace
        run: node scripts/check-npm-release.mjs
